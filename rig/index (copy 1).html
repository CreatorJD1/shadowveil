<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Shadowveil rig preview (contract v1.5.1)</title>

<body><div id="ui">

const W=1365,H=1739;
// Dev guard: only authored images + transforms may reach the screen. Every shape/path/text/pixel-write call throws.
function guard(ctx){for(const k of ['arc','arcTo','ellipse','stroke','fill','fillRect','strokeRect','rect','roundRect','lineTo','moveTo','bezierCurveTo','quadraticCurveTo','beginPath','closePath','clip','fillText','strokeText','putImageData','createLinearGradient','createRadialGradient','createConicGradient','createPattern']){ctx[k]=()=>{throw new Error('Contract violation: '+k+' is not allowed')}}return ctx}

// ---- parameters (contract v1.2 section 3) ----

for(const g in groups){const box=document.createElement('div');groupBox[g]=box;const t=document.createElement('h3');t.textContent=g;box.appendChild(t);for(const k of groups[g]){const l=document.createElement('label');const s=document.createElement('span');s.textContent=k.replace(/^Hand[LR]/,'');const i=document.createElement('input');i.type='range';i.min=P[k][0];i.max=P[k][1];i.step=0.01;i.value=v[k];i.oninput=()=>{v[k]=+i.value;draw()};inputs[k]=i;l.append(s,i);box.appendChild(l)}sl.appendChild(box)}
// only parameters that drive a delivered body part are enabled (e.g. ToeL/R need toes_L/R)
function setBodyUI(on,used){const b=groupBox['Body joints'];b.style.display=on?'':'none';for(const k of BODY_PARAMS){const en=on&&(!used||used.has(k));inputs[k].disabled=!en;inputs[k].parentNode.style.opacity=en?1:0.4;if(!en)set(k,P[k][2])}}
setBodyUI(false);
const t2=document.createElement('h3');t2.textContent='Hand presets';sl.appendChild(t2);
for(const [n,c] of Object.entries({Open:[0,0,0,0,0],Fist:[1,1,1,1,1],Point:[1,0,1,1,1],Peace:[1,0,0,1,1]})){const b=document.createElement('button');b.textContent=n;b.onclick=()=>{for(const h of['L','R'])['Thumb','Index','Middle','Ring','Pinky'].forEach((f,i)=>set('Hand'+h+f,c[i]));draw()};sl.appendChild(b)}

function normFace(eyes,mouth){const num=x=>Number.isFinite(+x)?+x:0;

function normParts(ps,warn,tag){if(!Array.isArray(ps))return ps;const withFile=new Set(ps.filter(p=>p&&p.file).map(p=>p.id));const seen=new Set();const out=[];

 if(r.body){const ps=r.body.parts;if(isV12('body',ps)){S.body='v1.2';for(const p of ps)Z['body:'+p.id]=p.layer}else{S.body='out of band (mapped by order)';let n=0;for(const p of byLayer(ps))Z['body:'+p.id]=200+Math.min(n++,99)}}

 if(r.hands){const ps=r.hands.parts;if(isV12('hands',ps)){S.hands='v1.2';for(const p of ps)Z['hands:'+p.id]=p.layer}else{S.hands='legacy (mapped)';let n=0;for(const p of byLayer(ps))if(p.file)Z['hands:'+p.id]=300+Math.min(n++,99)}}
 if(r.eyes){const ps=r.eyes.parts,by={};for(const p of ps)by[p.id]=p;
  if(isV12('eyes',ps)){S.eyes='v1.2';for(const p of ps)Z['eyes:'+p.id]=p.layer}
  else{S.eyes='legacy (mapped)';r.eyes.eyes.forEach((E,i)=>{for(const p of ps){if(!p.id.startsWith(E+'_'))continue;const s=p.id.slice(E.length+1);Z['eyes:'+p.id]=400+i*10+(s==='white'||s==='iris'?0:s.startsWith('lid_')?1:2)}})}}
 if(r.mouth){const ps=r.mouth.parts;if(isV12('mouth',ps)){S.mouth='v1.2';for(const p of ps)Z['mouth:'+p.id]=p.layer}else{S.mouth='legacy (mapped)';for(const p of ps)Z['mouth:'+p.id]=500}}

let R=null,view='apose',mouthState={cur:'mouth_rest',prev:null,t0:0};
async function load(){view=document.getElementById('view').value;for(const k in cache)delete cache[k];const b='../views/'+view+'/';
 const noFace=NO_FACE_VIEWS.has(view);
 let [eyes,mouth,hands,hair,body]=await Promise.all(['eyes','mouth','hands','hair','body'].map(s=>(noFace&&(s==='eyes'||s==='mouth'))?null:json(b+s+'/rig.json')));
 const warn0=[],empty=[];
 const set0=(s,j)=>{if(!j||typeof j!=='object')return null;if(Array.isArray(j))j={parts:j};const ps=partsOf(j);if(!ps||!ps.length){empty.push(s);return null}return Object.assign({},j,{parts:normParts(ps,warn0,s)})};
 eyes=set0('eyes',eyes);mouth=set0('mouth',mouth);hands=set0('hands',hands);body=set0('body',body);
 normFace(eyes,mouth);
 const hairParts=hair?normParts(partsOf(hair)||[],warn0,'hair'):null;
 const r={eyes,mouth,hands,hair:hairParts,hairCfg:(hair&&!Array.isArray(hair))?hair:{},body:null,im:{},frames:{},missing:[],warn:warn0,empty,noFace};
 r.im.base=await img(b+'base.png');r.im.body=await img(b+'base_body.png');
 for(const [s,j] of [['eyes',eyes],['mouth',mouth],['hands',hands]]){if(!j){if(!(noFace&&s!=='hands')&&!empty.includes(s))r.missing.push(s);continue}for(const p of j.parts)if(p.file)r.im[s+':'+p.id]=await img(b+s+'/'+p.file)}

 // body joints: active only when views/<view>/body/rig.json lists parts that load
 const bp=partsOf(body);
 if(bp&&bp.length){let n=0;for(const p of bp)if(p.file){const i=await img(b+'body/'+p.file);if(i){r.im['body:'+p.id]=i;n++}else r.warn.push('body part file missing: '+p.file)}
  if(n)r.body={cfg:Array.isArray(body)?{}:body,parts:bp}}
 // finger frames <part>_f0..f2.png (declared via part.frames, or probed); f0 must equal the part
 if(hands){for(const p of hands.parts){if(!p.file||!/^[LR]_(Thumb|Index|Middle|Ring|Pinky)\d$/.test(p.id))continue;const stem=p.file.replace(/\.png$/i,'');

  if(bad)r.warn.push(bad+'; frames ignored');
  else if(fr.length){const base=r.im['hands:'+p.id];const f0=fr[0];const child=hands.parts.find(q=>q.parent===p.id);const near=(a,x,y)=>!a||Math.hypot(a[0]-x,a[1]-y)<0.01;
   if(fr.some(f=>f.img.naturalWidth!==W||f.img.naturalHeight!==H))r.warn.push(p.id+': frame canvas is not '+W+'x'+H+'; frames ignored');
   else if(base&&!sameImage(f0.img,base))r.warn.push(p.id+': f0 differs from '+p.file+' (rest would change); frames ignored');
   else if(!near(f0.pivot,p.pivotX,p.pivotY)||(child&&!near(f0.childPivot,child.pivotX,child.pivotY)))r.warn.push(p.id+': f0 pivot/childPivot differ from the part (rest would change); frames ignored');
   else r.frames[p.id]=fr}}}
 // v1.4 skin mesh: views/<view>/body/skin.json, or ?skin=draft -> rig/skin_tools/drafts/<view>_skin.json
 // requested only when listed (body/rig.json "skin": "skin.json") or forced by ?skin=draft|<file>, so views without a skin make no 404 request
 const skinQ=new URLSearchParams(location.search).get('skin');const skinDecl=body&&!Array.isArray(body)&&typeof body.skin==='string'?body.skin:null;

 const sj=(skinQ==='off'||!skinUrl)?null:await json(skinUrl);if(sj){try{r.skin=await loadSkin(sj,b,r,skinUrl)}catch(e){r.warn.push('skin '+skinUrl+' rejected: '+e.message);r.skin=null}}
 await trimAll(r);if(eyes)for(const E of eyes.eyes)for(const id of lidIds(eyes,E))if(!r.im['eyes:'+id])r.warn.push('eye lid frame '+id+' not in eyes rig.json / not loaded');resolveLayers(r);r.mouthShapes=buildMouthShapes(r);r.hairInfo=hairChains(r.hair||[]);
 // wrist check: palm pivot should sit on its forearm's wristPivot
 if(r.body&&hands){const by={};for(const p of r.body.parts)by[p.id]=p;for(const p of hands.parts){if(!/_palm$/.test(p.id)||!p.file||p.hidden)continue;const fa=by[palmParent(p)];if(!fa)continue;const wp=pt(fa.wristPivot);if(!wp){r.warn.push(fa.id+' has no wristPivot');continue}if(Math.hypot(wp[0]-(p.pivotX||0),wp[1]-(p.pivotY||0))>2)r.warn.push(p.id+' pivot is '+Math.hypot(wp[0]-p.pivotX,wp[1]-p.pivotY).toFixed(1)+' px from '+fa.id+'.wristPivot')}}

 R=r;const drv=new Set();if(r.body)r.body.parts.filter(p=>p.file).forEach(p=>{const k=bodyParamOf(p);if(k)drv.add(k)});if(r.skin)r.skin.bones.forEach(p=>{if(p.param)drv.add(p.param)});setBodyUI(!!(r.body||r.skin),drv);

 status((r.missing.length?'Not delivered yet for '+view+': '+r.missing.join(', '):'All part sets loaded for '+view)+(r.skin?'\nbody: skin mesh '+r.skin.src+' ('+r.skin.nv+' vertices, '+r.skin.nt+' triangles, groups '+r.skin.groups.map(g=>g.layer).join('/')+')'+(r.skin.underlay?(r.skin.underlay.ok?'\nskin underlay: '+r.skin.underlay.src+' ('+r.skin.underlay.nt+' triangles, layer '+r.skin.underlay.z+', rest footprint '+r.skin.underlay.check.footprintPx+' px fully hidden)':'\nskin underlay REJECTED: '+r.skin.underlay.reason):''):'')+(r.body?'\nbody: '+Object.keys(r.im).filter(k=>k.startsWith('body:')).length+' jointed parts':(r.im.body?'':'\nbase_body.png missing, using base.png'))+'\nlayers: '+Object.entries(r.scheme).map(([k,x])=>k+'='+x).join(', ')+'\nmouth shapes: '+r.mouthShapes.map(s=>s.name).join(', ')+(Object.keys(r.frames).length?'\nfinger frames: '+Object.keys(r.frames).length+' segments':'')+(r.warn.length?'\nWARN: '+r.warn.join('\nWARN: '):''));draw()}
// v1.3 performance: parts are full-canvas PNGs; crop each to its alpha bounding box once at load (exact pixel copy)
// and remember the integer offset (ox, oy). drawM adds the offset, so output is identical, only faster.
function trim(i){if(!i||i.ox!=null)return i;const w=i.naturalWidth||i.width,h=i.naturalHeight||i.height;const o=document.createElement('canvas');o.width=w;o.height=h;const q=guard(o.getContext('2d'));q.drawImage(i,0,0);const d=q.getImageData(0,0,w,h).data;
 let x0=w,y0=h,x1=-1,y1=-1;for(let y=0;y<h;y++){const row=y*w*4;for(let x=0;x<w;x++)if(d[row+x*4+3]){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;y1=y}}

async function trimAll(r){for(const k in r.im)if(k!=='base'&&k!=='body')r.im[k]=trim(r.im[k]);for(const id in r.frames)for(const f of r.frames[id])f.img=trim(f.img)}
function sameImage(a,b){const f=x=>{const o=document.createElement('canvas');o.width=W;o.height=H;const q=guard(o.getContext('2d'));q.drawImage(x,0,0);return q.getImageData(0,0,W,H).data};const A=f(a),B=f(b);for(let i=0;i<A.length;i++)if(A[i]!==B[i])return false;return true}
const pt=w=>Array.isArray(w)?w:(w&&w.x!=null?[w.x,w.y]:null);
const palmParent=p=>p.parentExternal||('forearm_'+p.id[0]);
function status(s){document.getElementById('status').textContent=s}
function mul(a,b){return[a[0]*b[0]+a[2]*b[1],a[1]*b[0]+a[3]*b[1],a[0]*b[2]+a[2]*b[3],a[1]*b[2]+a[3]*b[3],a[0]*b[4]+a[2]*b[5]+a[4],a[1]*b[4]+a[3]*b[5]+a[5]]}

const I=[1,0,0,1,0,0];const T=(dx,dy)=>[1,0,0,1,dx,dy];
// ext(p): world matrix for a root whose parent is outside this manifest (hand palm -> body forearm)
function chain(parts,angle,ext,parentOf){const by={},M={};for(const p of parts)by[p.id]=p;const par=parentOf||(p=>p.parent);

 const bi=Object.fromEntries(Sk.bones.map((b,i)=>[b.id,i]));const pI=bi[parentId];if(pI==null)return[];const side=new Int8Array(Sk.nv);

 return out} // pairs of vertex indices; seam point = edge midpoint
function cutSeam(topA,otherA,restA){const out=[];for(let y=2;y<H-2;y++)for(let x=2;x<W-2;x++){const i=y*W+x;if(topA[i]<128)continue;if(topA[i-1]>=128&&topA[i+1]>=128&&topA[i-W]>=128&&topA[i+W]>=128)continue;
  let near=false;for(let dy=-2;dy<=2&&!near;dy++)for(let dx=-2;dx<=2;dx++)if(otherA[i+dy*W+dx]>=128){near=true;break}if(near&&restA[i]>=128)out.push([x+0.5,y+0.5])}return out}

 const A=(x,y)=>(x<0||y<0||x>=w||y>=h)?0:d[(y*w+x)*4+3];const ws=[];let zero=0;

  const gx=(A(x+1,y-1)+2*A(x+1,y)+A(x+1,y+1))-(A(x-1,y-1)+2*A(x-1,y)+A(x-1,y+1)),gy=(A(x-1,y+1)+2*A(x,y+1)+A(x+1,y+1))-(A(x-1,y-1)+2*A(x,y-1)+A(x+1,y-1));const gl=Math.hypot(gx,gy);if(gl<1)continue;
  const nx=gx/gl,ny=gy/gl;let run=0,started=false,lead=0;for(let t=-1;t<=14;t+=0.25){const sx=Math.floor(x+0.5+nx*t),sy=Math.floor(y+0.5+ny*t);if(sx<0||sy<0||sx>=w||sy>=h)break;const q=(sy*w+sx)*4;const L=JT_LINE(d[q],d[q+1],d[q+2],d[q+3]);if(L){started=true;run++}else if(started)break;else if((lead+=0.25)>2.0)break}
  if(!run)zero++;else ws.push(run*0.25)}

 // seam coverage: alpha at each seam point
 const al=[];for(const [px,py] of pts){const x=Math.floor(px)-Wd.x0,y=Math.floor(py)-Wd.y0;al.push(excl&&excl(Math.floor(px),Math.floor(py))?-1:A(x,y))}
 return{holes,tears,edges:n+zero,n,zero,mean:n?ws.reduce((s,x)=>s+x,0)/n:0,min:n?ws[0]:0,p10:n?ws[Math.floor(n*0.1)]:0,alpha:al}}
async function jointTest(deg=25){if(!R||mqRunning)return;mqRunning=true;const saved={};for(const k in P)saved[k]=v[k];const sQ=QUAL,bmE=document.getElementById('bodymode'),sB=bmE.value,qE=document.getElementById('quality'),ulE=document.getElementById('underlay'),sU=ulE.checked;const res=[];
 try{status('Joint test: running ('+view+') ...');await new Promise(r=>setTimeout(r,0));for(const k in P)v[k]=P[k][2];hairDrive=null;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=guard(cv.getContext('2d'));render(g,true);const restCv=document.createElement('canvas');restCv.width=W;restCv.height=H;restCv.getContext('2d').drawImage(cv,0,0);

  const quals=['nearest','linear','ss2'];const cutBy=R.body?Object.fromEntries(R.body.parts.map(p=>[p.id,p])):{};const alphaCache={};const aOf=id=>alphaCache[id]||(alphaCache[id]=partAlpha(id.startsWith('hands:')?R.im[id]:R.im['body:'+id]));
  for(const [name,base] of[['shoulder','Shoulder'],['elbow','Elbow'],['hip','Hip'],['knee','Knee'],['ankle','Ankle'],['wrist','Wrist']])for(const s of['L','R']){const k=base+s;if(!(k in P))continue;
   let x=1,cutDef=null,skinDef=null,palm=null;
   if(base==='Wrist'){palm=R.hands&&R.hands.parts.find(p=>p.parentExternal&&p.id[0]===s&&p.file);if(!palm)continue;const mx=+(palm.maxWristDeg??R.hands.wristMaxDeg??25);x=Math.min(1,deg/mx);const fa=palmParent(palm);
    const pts=cutSeam(aOf('hands:'+palm.id),cutBy[fa]?aOf(fa):restA,restA);cutDef={pts,top:'palm'};if(R.skin)skinDef={pts,top:'palm'}}
   else{const cp=R.body&&R.body.parts.find(p=>p.file&&bodyParamOf(p)===k);const cb=R.skin&&R.skin.bones.find(b=>bodyParamOf(b)===k);const any=cp||cb;if(!any)continue;
    v[k]=1;const a=Math.abs(bodyAngle(any));v[k]=0;if(!(a>0))continue;x=Math.min(1,deg/a);
    if(cp){const pid=cp.parent!==undefined?cp.parent:BODY_PARENT_OF[cp.id];const pp=cutBy[pid];if(pp&&pp.file){const childTop=(R.z['body:'+cp.id]??0)>(R.z['body:'+pp.id]??0);
      cutDef={pts:childTop?cutSeam(aOf(cp.id),aOf(pp.id),restA):cutSeam(aOf(pp.id),aOf(cp.id),restA),top:childTop?cp.id:pp.id}}}
    if(cb&&cb.parent){const pairs=skinSeam(R.skin,cb.id,cb.parent);if(pairs.length){const V=R.skin.V;skinDef={pairs,pts:pairs.map(([a,b])=>[(V[2*a]+V[2*b])/2,(V[2*a+1]+V[2*b+1])/2])}}}}
   // v1.5.1 hips: only the outer hip outline is scored. The medial side (towards the other hip pivot: the inner crotch edge between the thighs)

   const hipExcl=b=>{if(base!=='Hip')return null;const o=s==='L'?'R':'L';const src=b==='cut'?(R.body?R.body.parts:[]):(R.skin?R.skin.bones:[]);
    const me=src.find(p=>bodyParamOf(p)==='Hip'+s),ot=src.find(p=>bodyParamOf(p)==='Hip'+o);if(!me||!ot||Math.abs(ot.pivotX-me.pivotX)<4)return null;
    const sg=Math.sign(ot.pivotX-me.pivotX),px0=me.pivotX;const f=(x,y)=>(x+0.5-px0)*sg>0;f.desc='medial side '+(sg>0?'x > ':'x < ')+px0+' excluded';return f};
   const row={joint:name+'_'+s,param:k,x:+x.toFixed(3),modes:{},seams:{},excl:{}};

   for(const b of bodies){const def=b==='cut'?cutDef:skinDef;if(!def||!def.pts.length)continue;bmE.value=b==='cut'?'cut':'skin';ulE.checked=b==='skin+underlay';
    for(const q of quals){QUAL=q;v[k]=x;renderFinal(g,false);
     let posed;if(def.pairs){const D=R.skin.def;posed=def.pairs.map(([a,c])=>[(D[2*a]+D[2*c])/2,(D[2*a+1]+D[2*c+1])/2])}

     v[k]=0;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const [px,py] of def.pts.concat(posed)){x0=Math.min(x0,px);y0=Math.min(y0,py);x1=Math.max(x1,px);y1=Math.max(y1,py)}

     if(!restCache[rkey]){const Rw=win(restCv);restCache[rkey]=seamMetrics(Rw,def.pts,stampMask(Rw,def.pts,8),stampMask(Rw,def.pts,10),ex)}
     const rm=restCache[rkey];const Pw=win(cv);const pm=seamMetrics(Pw,posed,stampMask(Pw,posed,8),stampMask(Pw,posed,10),ex);
     let thin=0,full=0;for(let i=0;i<pm.alpha.length;i++)if(rm.alpha[i]===255&&pm.alpha[i]>=0){full++;if(pm.alpha[i]<255)thin++}

    const A=agg[m]||(agg[m]={dh:0,dt:0,thin:0,thinOf:0,ratio:0,nr:0,min:1e9,zero:0,edges:0,rz:0,re:0});A.dh+=Math.max(0,s.holes-s.restHoles);A.dt+=Math.max(0,s.tears-s.restTears);A.thin+=s.thin;A.thinOf+=s.thinOf;

  const best={};for(const b of bodies){const c=summ.filter(s=>s.m.startsWith(b+'/')&&s.ratio!=null).sort((a,c)=>(a.newHoles+a.newTears)-(c.newHoles+c.newTears)||Math.abs(1-a.ratio)-Math.abs(1-c.ratio));if(c.length)best[b]=c[0].m}
  const head=['SUMMARY ('+view+', joints bent to '+deg+' deg; metrics in an 8/10 px band along the whole parent/child seam, vs rest; hips: outer hip outline only, medial inner-crotch side excluded):',...summ.map(s=>'  '+s.m.padEnd(22)+' new holes '+s.newHoles+' px, new tears '+s.newTears+' px, seam alpha<255 '+f(s.thinPct,1)+'%, outline width '+(s.ratio!=null?f(100*s.ratio,1)+'% of rest (min '+f(s.min)+' px, '+s.joints+' joints)':'n/a')+', edges without line '+f(s.noLinePct,1)+'% (rest '+f(s.restNoLinePct,1)+'%)'),
   '  best (fewest new holes+tears, then width closest to rest): '+Object.entries(best).map(([b,m])=>b+' -> '+m).join(', ')];
  window.JT={view,deg,rows:res,summary:summ,best};status('Joint test ('+view+')\n'+head.join('\n')+'\n'+lines.join('\n'))}
 catch(e){status('Joint test: FAIL (exception) '+e.message+' '+(e.stack||'').split('\n')[1])}
 finally{QUAL=sQ;bmE.value=sB;qE.value=sQ;ulE.checked=sU;hairDrive=null;for(const k in P)set(k,saved[k]);mqRunning=false;draw()}
