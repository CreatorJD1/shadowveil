<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Pose driver (Clean room)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#14161b;--fg:#dde1e8;--mut:#8a93a3;--line:#2a2f39;--acc:#6aa9ff;--ok:#3ecf8e;--bad:#ff6b6b;--na:#c9a227}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif}
#app{display:grid;grid-template-columns:minmax(260px,1fr) 340px;grid-template-rows:auto 1fr auto;height:100%;gap:0}
header{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:#1a1d24}
header b{margin-right:6px}
button,select{background:#232733;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:3px 8px;cursor:pointer;font-size:12px}
button.on{background:var(--acc);color:#081018;border-color:var(--acc)}button:disabled{opacity:.45;cursor:not-allowed}
#stagewrap{position:relative;min-height:0;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#20232a 0 25%,#1b1e24 0 50%) 0 0/24px 24px}
#stage{height:100%;max-width:100%;object-fit:contain;display:block}
#hud{position:absolute;left:8px;top:8px;background:#000a;padding:4px 8px;border-radius:4px;font:12px ui-monospace,monospace;white-space:pre}
aside{border-left:1px solid var(--line);overflow:auto;padding:8px}
aside h3{margin:10px 0 4px;font-size:12px;text-transform:uppercase;color:var(--mut);letter-spacing:.05em}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.badge{border:1px solid var(--line);border-radius:4px;padding:3px;text-align:center;font-size:11px;cursor:pointer;background:#1c2029}
.badge img{width:100%;height:70px;object-fit:contain;display:block;background:#101216}
.badge .t{display:block;margin-top:2px;font-weight:600}
.badge.ok .t{color:var(--ok)}.badge.bad .t{color:var(--bad)}.badge.na .t{color:var(--na)}
.badge.cur{outline:2px solid var(--acc)}
.small{font-size:11px;color:var(--mut);line-height:1.35}
footer{grid-column:1/3;border-top:1px solid var(--line);padding:6px 10px;background:#1a1d24}
#tl{position:relative;height:34px;background:#101216;border:1px solid var(--line);border-radius:4px;cursor:pointer}
#tl .mk{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px}
#tl .mk{background:#6aa9ff}#tl .mk.ho{background:#3ecf8e;width:3px}#tl .mk.nh{background:#ff6b6b;width:2px;opacity:.9}#tl .mk span{position:absolute;top:18px;left:3px;font-size:10px;white-space:nowrap;color:var(--mut)}#tl .mk.ho span{color:var(--ok)}#tl .bm{position:absolute;top:0;height:6px;width:2px;background:#c9a227;opacity:.6}#tl .bm.false{background:#ff6b6b}
#rigs{position:fixed;left:0;bottom:0;width:4px;height:4px;overflow:hidden;opacity:0;pointer-events:none}#rigs iframe{width:1400px;height:900px;border:0}
#tl .seg{position:absolute;top:0;height:14px;opacity:.35}
#tl #ph{position:absolute;top:0;bottom:0;width:3px;margin-left:-1px;background:#fff}
#phases{display:flex;gap:4px;margin-top:5px}#phases span{padding:2px 8px;border-radius:3px;background:#232733;font-size:11px}#phases span.on{background:var(--acc);color:#081018}
#talk canvas{width:100%;background:repeating-conic-gradient(#20232a 0 25%,#1b1e24 0 50%) 0 0/16px 16px;display:block}
#qa{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;margin-top:4px}#qa img{width:100%;display:block;cursor:pointer;border:1px solid var(--line)}
.ref{display:grid;grid-template-columns:1fr 1fr;gap:4px}.ref img{width:100%;background:#101216;display:block}
label{font-size:12px;display:inline-flex;gap:3px;align-items:center}
</style></head><body>
<div id="app">
 <header>
  <b>Pose driver (Clean room)</b>
  <button id="play" class="on">Auto ▶</button>
  <span class="small">target</span><span id="targets"></span>
  <span class="small">rest</span><select id="base"></select>
  <label><input type="checkbox" id="lSway" checked>idle sway</label>
  <label><input type="checkbox" id="lDespill" checked>blue despill</label>
  <span class="small">speed</span><select id="speed"><option>0.5</option><option selected>1</option><option>1.5</option><option>2</option></select>
 </header>
 <div id="stagewrap"><canvas id="stage" width="1365" height="1739"></canvas><div id="hud"></div></div>
 <aside>
  <h3>Turn · rules</h3>
  <div class="small" id="rules"></div>
  <h3>Mouth · talk (front rest only)</h3>
  <div id="talk">
   <div><button id="talkbtn">Talk ▶</button> <select id="talkclip"><option value="0">talk-speak</option><option value="1">talk-ask</option><option value="2">talk-laugh</option></select> <span class="small" id="talknote"></span></div>
   <canvas id="talkcv" width="768" height="1168"></canvas>
   <div id="qa"></div><div class="small">QA frames at 0.4 / 1.8 / 3.2 / 5.0 s (click to seek)</div>
  </div>
  <div id="rigs" aria-hidden="true"></div>
 </aside>
 <footer>
  <input type="range" id="dial" min="1" max="232" value="1" style="width:100%" title="Turn dial: authored frame f001–f232">
  <div id="tl"><div id="ph"></div></div>
  <div id="phases"><span data-p="idle">rest</span><span data-p="turn">turn</span><span data-p="hold">hold</span><span data-p="drift">drift</span><span data-p="talk">talk</span><span data-p="manual">manual dial</span></div>
 </footer>
</div>
<script src="driver.js"></script>
</body></html>
